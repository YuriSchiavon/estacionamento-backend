<title>Totem de Entrada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root{
    --navy:#142A4B;
    --lime:#DBFF00;
    --danger:#C0392B;
    --ok:#1E8E4F;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html,body{overscroll-behavior:none;}
  body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:var(--navy);
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    touch-action:manipulation;
  }
  .config-link{
    position:fixed;
    top:20px;
    right:24px;
    font-size:12px;
    color:#6A7A9C;
    text-decoration:none;
  }
  .login-box{
    width:100%;
    max-width:340px;
    background:#0F2038;
    border:1px solid #24365A;
    border-radius:16px;
    padding:32px;
  }
  .login-box h1{font-size:18px;margin:0 0 6px;}
  .login-box p{font-size:13px;color:#B9C2D6;margin:0 0 20px;}
  label{display:block;font-size:12px;font-weight:600;color:#B9C2D6;margin:14px 0 6px;}
  input{
    width:100%;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid #2C3E5C;
    background:#16294A;
    color:#fff;
    font-family:inherit;
    font-size:15px;
  }
  .erro{color:#FF8A75;font-size:13px;margin-top:12px;display:none;}
  .campo-senha{position:relative;}
  .campo-senha input{padding-right:64px;}
  .campo-senha .toggle-senha{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    font-size:11px;
    font-weight:700;
    color:var(--lime);
    cursor:pointer;
    padding:4px 6px;
  }
  .lista-unidades{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
  .btn-unidade{
    background:#16294A;
    border:1px solid #2C3E5C;
    color:#fff;
    padding:20px;
    border-radius:12px;
    font-family:inherit;
    font-weight:700;
    font-size:18px;
    text-align:left;
    cursor:pointer;
  }
  .btn-unidade:hover{border-color:var(--lime);}
  .kiosk{
    width:100%;
    max-width:560px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:1;
    justify-content:center;
  }
  .logo-grande{
    font-weight:800;
    font-size:clamp(32px, 6vw, 52px);
    letter-spacing:1px;
    margin-bottom:56px;
  }
  .logo-grande span{color:var(--lime);}
  button.retirar{
    background:var(--lime);
    color:var(--navy);
    border:none;
    border-radius:32px;
    padding:9vh 40px;
    font-family:inherit;
    font-weight:800;
    font-size:clamp(26px, 4.5vw, 40px);
    cursor:pointer;
    width:100%;
    box-shadow:0 10px 30px rgba(219,255,0,.15);
  }
  button.retirar:hover{filter:brightness(0.97);}
  button.retirar:disabled{opacity:.5;cursor:default;}
  button.entrar-btn{
    margin-top:10px;
    background:var(--lime);
    color:var(--navy);
    border:none;
    padding:14px;
    border-radius:8px;
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    width:100%;
  }
  .resultado{
    margin-top:32px;
    display:none;
  }
  .resultado.show{display:block;}
  .resultado .titulo{font-size:16px;color:var(--lime);font-weight:700;margin-bottom:12px;}
  .ticket-code{
    font-family:'Courier New',monospace;
    font-weight:700;
    font-size:26px;
    letter-spacing:2px;
    background:#fff;
    color:var(--navy);
    padding:16px;
    border-radius:10px;
    display:block;
  }
  .resultado.err .titulo{color:#FF8A75;}
  .rodape-conta{
    margin-top:40px;
    display:flex;
    gap:18px;
    justify-content:center;
  }
  .rodape-conta button{
    font-size:12px;
    color:#6A7A9C;
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
  }
  button.reimprimir{
    margin-top:20px;
    background:none;
    color:var(--lime);
    border:1px solid var(--lime);
    padding:12px 20px;
    border-radius:8px;
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    width:100%;
    display:none;
  }
  button.reimprimir.show{display:block;}
  #area-impressao{display:none;}
  @media print{
    body *{visibility:hidden;}
    #area-impressao, #area-impressao *{visibility:visible;}
    #area-impressao{
      display:block;
      position:fixed;
      top:0; left:0;
      width:100%;
      padding:24px;
      color:#000;
      text-align:center;
    }
    #area-impressao .ip-marca{font-weight:800;font-size:18px;margin-bottom:4px;}
    #area-impressao .ip-unidade{font-size:13px;margin-bottom:16px;}
    #area-impressao .ip-codigo{font-family:'Courier New',monospace;font-size:22px;font-weight:700;letter-spacing:2px;margin:12px 0;}
    #area-impressao .ip-qr{margin:12px auto;}
    #area-impressao .ip-qr svg{width:140px;height:140px;}
    #area-impressao .ip-horario{font-size:13px;}
  }
</style>

<a class="config-link" href="/" id="link-inicio" style="display:none;">início</a>

<div class="login-box" id="tela-login">
  <h1>Configurar totem</h1>
  <p>Faça login uma vez com a conta desta cancela de entrada. Fica salvo neste equipamento.</p>
  <label>Usuário</label>
  <input id="login-user" placeholder="usuário do totem">
  <label>Senha</label>
  <div class="campo-senha">
    <input id="login-senha" type="password">
    <button type="button" class="toggle-senha" data-alvo="login-senha">mostrar</button>
  </div>
  <button class="entrar-btn" id="btn-login">Entrar</button>
  <div class="erro" id="erro-login"></div>
</div>

<div class="login-box" id="tela-selecao-unidade" style="display:none;">
  <h1>Selecione a unidade</h1>
  <p>Esta conta tem acesso a mais de uma unidade. Escolha em qual este totem vai emitir tickets.</p>
  <div class="lista-unidades" id="lista-unidades"></div>
</div>

<div class="kiosk" id="tela-kiosk" style="display:none;">
  <div class="logo-grande">MY PARK<span>·</span>ENTRADA</div>
  <button class="retirar" id="btn-entrada">RETIRAR TICKET</button>
  <div class="resultado" id="resultado">
    <div class="titulo" id="resultado-titulo"></div>
    <div class="ticket-code" id="resultado-codigo"></div>
  </div>
  <button class="reimprimir" id="btn-reimprimir">Imprimir novamente</button>
  <div class="rodape-conta">
    <button id="btn-trocar-unidade" style="display:none;">trocar unidade</button>
    <button id="btn-trocar">trocar conta deste totem</button>
  </div>
</div>

<div id="area-impressao">
  <div class="ip-marca">MY PARK</div>
  <div class="ip-unidade" id="ip-unidade"></div>
  <div class="ip-codigo" id="ip-codigo"></div>
  <div class="ip-qr" id="ip-qr"></div>
  <div class="ip-horario" id="ip-horario"></div>
</div>

<script>
document.addEventListener('contextmenu', e => e.preventDefault());

const API = "";
const CHAVE_SESSAO = 'sessao_totem_entrada';
let sessao = null;

function carregarSessao(){
  const salva = localStorage.getItem(CHAVE_SESSAO);
  if (salva) sessao = JSON.parse(salva);
}

function salvarSessao(){
  localStorage.setItem(CHAVE_SESSAO, JSON.stringify(sessao));
}

function mostrarTela(){
  document.getElementById('tela-login').style.display = 'none';
  document.getElementById('tela-selecao-unidade').style.display = 'none';
  document.getElementById('tela-kiosk').style.display = 'none';
  document.getElementById('link-inicio').style.display = 'none';

  if (!sessao){
    document.getElementById('tela-login').style.display = 'block';
    document.getElementById('link-inicio').style.display = 'block';
    return;
  }
  if (!sessao.unidade_operacional_id){
    document.getElementById('tela-selecao-unidade').style.display = 'block';
    return;
  }
  document.getElementById('tela-kiosk').style.display = 'flex';
}

// Igual ao mecanismo já usado em operacao.html: conta de totem normal
// (papel totem_entrada) sempre tem 1 unidade só -- pula a seleção, zero
// mudança de comportamento. Só quem enxerga mais de uma (dono/gerente de
// operações, testando direto por aqui) vê a tela de escolha.
async function resolverUnidadeOperacional(forcarSelecao){
  try{
    const resp = await fetch(API + '/auth/minhas-unidades', {
      headers: { 'Authorization': `Bearer ${sessao.token}` },
    });
    if (resp.status === 401){
      sessao = null;
      localStorage.removeItem(CHAVE_SESSAO);
      mostrarTela();
      return;
    }
    const unidades = await resp.json();
    document.getElementById('btn-trocar-unidade').style.display = unidades.length > 1 ? 'inline' : 'none';

    if (unidades.length === 0){
      alert('Esta conta não tem nenhuma unidade disponível.');
      sessao = null;
      localStorage.removeItem(CHAVE_SESSAO);
      mostrarTela();
      return;
    }
    if (unidades.length === 1){
      sessao.unidade_operacional_id = unidades[0].id;
      salvarSessao();
      mostrarTela();
      return;
    }
    if (!forcarSelecao && sessao.unidade_operacional_id && unidades.some(u => u.id === sessao.unidade_operacional_id)){
      mostrarTela();
      return;
    }
    sessao.unidade_operacional_id = null;
    salvarSessao();
    const lista = document.getElementById('lista-unidades');
    lista.innerHTML = unidades.map(u => `<button class="btn-unidade" data-id="${u.id}">${u.nome}</button>`).join('');
    lista.querySelectorAll('.btn-unidade').forEach(btn => {
      btn.addEventListener('click', () => {
        sessao.unidade_operacional_id = parseInt(btn.dataset.id, 10);
        salvarSessao();
        mostrarTela();
      });
    });
    mostrarTela();
  }catch(e){
    alert('Erro ao carregar as unidades disponíveis: ' + e.message);
  }
}

carregarSessao();
mostrarTela();
if (sessao) resolverUnidadeOperacional(false);

document.querySelectorAll('.toggle-senha').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.alvo);
    const visivel = input.type === 'text';
    input.type = visivel ? 'password' : 'text';
    btn.textContent = visivel ? 'mostrar' : 'ocultar';
  });
});

document.getElementById('btn-login').addEventListener('click', async () => {
  const username = document.getElementById('login-user').value;
  const senha = document.getElementById('login-senha').value;
  const erro = document.getElementById('erro-login');
  erro.style.display = 'none';
  try{
    const resp = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, senha }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || 'Login inválido');
    sessao = data;
    salvarSessao();
    await resolverUnidadeOperacional(false);
  }catch(e){
    erro.textContent = e.message;
    erro.style.display = 'block';
  }
});

document.getElementById('btn-trocar-unidade').addEventListener('click', () => {
  resolverUnidadeOperacional(true);
});

document.getElementById('btn-trocar').addEventListener('click', async () => {
  if (sessao){
    try{ await fetch(API + '/auth/logout', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: sessao.token }),
    }); }catch(e){}
  }
  sessao = null;
  localStorage.removeItem(CHAVE_SESSAO);
  mostrarTela();
});

document.getElementById('btn-entrada').addEventListener('click', async () => {
  const btn = document.getElementById('btn-entrada');
  const resultado = document.getElementById('resultado');
  btn.disabled = true;
  try{
    const resp = await fetch(API + '/entrada?unidade_id=' + sessao.unidade_operacional_id, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${sessao.token}` },
    });
    const t = await resp.json();
    if (resp.status === 401){
      sessao = null;
      localStorage.removeItem(CHAVE_SESSAO);
      mostrarTela();
      return;
    }
    if (!resp.ok) throw new Error(t.detail || 'Erro ao emitir ticket');
    resultado.className = 'resultado show';
    document.getElementById('resultado-titulo').textContent = 'Retire seu ticket';
    document.getElementById('resultado-codigo').textContent = t.codigo_barras;
    imprimirTicket(t);
    document.getElementById('btn-reimprimir').classList.add('show');
  }catch(e){
    resultado.className = 'resultado show err';
    document.getElementById('resultado-titulo').textContent = e.message;
    document.getElementById('resultado-codigo').textContent = '';
    document.getElementById('btn-reimprimir').classList.remove('show');
  }finally{
    btn.disabled = false;
  }
});

// window.print() é o substituto em software pra impressora térmica
// real -- ver driver de hardware no README para a integração futura.
let ultimoTicketImpresso = null;

function imprimirTicket(t){
  ultimoTicketImpresso = t;
  document.getElementById('ip-unidade').textContent = t.unidade_nome || '';
  document.getElementById('ip-codigo').textContent = t.codigo_barras;
  document.getElementById('ip-qr').innerHTML = t.qr_code_svg || '';
  document.getElementById('ip-horario').textContent = new Date(t.data_hora_entrada).toLocaleString('pt-BR');
  window.print();
}

document.getElementById('btn-reimprimir').addEventListener('click', () => {
  if (ultimoTicketImpresso) imprimirTicket(ultimoTicketImpresso);
});
</script>
