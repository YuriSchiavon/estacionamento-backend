org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# O repositório fica em "...\Área de Trabalho\..." (acento) -- o Android
# Gradle Plugin recusa compilar em caminho não-ASCII por padrão; esta é
# a solução oficial sugerida pelo próprio erro do AGP quando isso
# acontece (https://issuetracker.google.com/issues/... "Your project
# path contains non-ASCII characters").
android.overridePathCheck=true
