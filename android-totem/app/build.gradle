plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mypark.totem'
    compileSdk 34

    defaultConfig {
        applicationId "com.mypark.totem"
        // minSdk 33 -- mesmo valor usado nos exemplos oficiais da Gertec
        // (EasyLayer/GerSDK Varejo, ver android-totem/app/libs/) pro
        // SK210, que roda Android 13. Não compensa suportar versão mais
        // antiga que o próprio SDK do fabricante já assume.
        minSdk 33
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Os layouts internos do AAR da EasyLayer (telas de leitura/diálogos
    // do leitor) usam ConstraintLayout -- não é usado diretamente em
    // nenhum layout nosso, mas precisa estar disponível pra resolver os
    // atributos deles na hora de linkar os recursos (mesma dependência
    // presente nos exemplos oficiais da Gertec).
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // SDKs da Gertec pro SK210 (ver app/libs/) -- GerSDK Varejo pra
    // impressora térmica, EasyLayer pro leitor 1D/2D. Baixados do portal
    // de desenvolvedor da Gertec (gertec.atlassian.net), não são
    // publicados em nenhum repositório Maven público.
    // O AAR da EasyLayer (leitor 1D/2D) já embute a com.google.zxing:core
    // inteira -- SaidaActivity.gerarBitmapQr() usa
    // com.google.zxing.qrcode.QRCodeWriter direto dela, sem precisar
    // declarar a dependência nós mesmos (declarar de novo só duplicava
    // as classes e quebrava o build).
    implementation fileTree(dir: 'libs', include: ['*.aar'])
}
