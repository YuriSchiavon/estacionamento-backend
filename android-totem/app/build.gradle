plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mypark.totem'
    compileSdk 34

    defaultConfig {
        applicationId "com.mypark.totem"
        // minSdk 24 cobre qualquer equipamento razoavelmente recente (o
        // Gertec SK210 roda Android 13 / API 33); Lock Task Mode (modo
        // quiosque) já existe desde a API 21.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
